name: release

# On push to main touching the skill's sources: rebuilds the .skill, bumps the
# patch of the latest Release and publishes the new version along with its .zip
# copy ("folder" import for Mistral/Gemini). This is the only distribution
# channel: these artifacts are never committed, and the download buttons of
# docs/index.html point to /releases/latest/download/.

on:
  push:
    branches: [main]
    paths:
      - 'app-autonome/**'
  # Manual trigger (Actions tab): re-publish without committing to the sources.
  workflow_dispatch:

permissions:
  contents: write

# Two close merges must not compute the same version in parallel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the .skill
        env:
          # Never name a variable "ZIP": Info-ZIP reads the ZIP and ZIPOPT
          # environment variables as default options, and the archive would
          # then be created under the wrong name, silently.
          SRC: app-autonome
          OUT: app-autonome.skill
          ZIP_COPY: app-autonome.zip
        run: |
          set -euo pipefail
          # Guard: the description must fit in 500 characters, the strictest
          # limit among the targeted platforms (Mistral; Claude, ChatGPT and
          # Gemini/AgentSkills tolerate 1024). Measured without the surrounding
          # quotes (real YAML value). We block before packaging.
          DESC_LEN=$(python3 -c 'import re,sys; t=open(sys.argv[1],encoding="utf-8").read(); m=re.search(r"^description:[ \t]*(.*)$", t, re.M); v=m.group(1).strip() if m else None; v=(v[1:-1] if (v is not None and len(v)>=2 and v[0]==v[-1]==chr(34)) else v); print(len(v) if v is not None else -1)' "$SRC/SKILL.md")
          if [ "$DESC_LEN" -lt 1 ] || [ "$DESC_LEN" -gt 500 ]; then
            echo "Error: 'description' is $DESC_LEN characters (expected 1 to 500, Mistral limit)." >&2
            exit 1
          fi
          echo "OK: description = $DESC_LEN/500 characters."
          # zip -X only strips the extra fields (uid/gid): mtimes and entry order
          # remain variable. We pin both so that two runs on the same commit
          # produce an identical file.
          TS=$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y%m%d%H%M.%S)
          find "$SRC" -exec touch -t "$TS" {} +
          # -prune: never ship local artifacts (__pycache__, .pyc, .DS_Store):
          # the CI checkout is clean because they are gitignored, but if a step
          # generates a __pycache__ before the zip, the release stays clean.
          find "$SRC" \( -name "__pycache__" -o -name "*.pyc" -o -name ".DS_Store" \) -prune -o -print \
            | LC_ALL=C sort | TZ=UTC zip -qX -@ "$OUT"
          # Second artifact for the "folder" import (Mistral/Gemini): byte-for-byte
          # copy of the .skill, hence just as deterministic.
          cp "$OUT" "$ZIP_COPY"
          unzip -l "$OUT"
          sha256sum "$OUT" "$ZIP_COPY"

      - name: Compute the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Patch bumped from the latest Release (v1.0.0 if there is none).
          # With no release, the API answers 404 and gh prints the JSON error
          # body on stdout: a "|| echo \"\"" inside the substitution clears
          # nothing, so LAST must be reassigned outside the capture to fall back.
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || LAST=""
          if [ -z "$LAST" ]; then
            TAG="v1.0.0"
          else
            TAG=$(echo "$LAST" | awk -F. '{ $NF = $NF + 1; print }' OFS=.)
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version: ${LAST:-none} -> $TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh also creates the $TAG tag on the pushed commit, so there is no tag to push by hand.
          gh release create "$TAG" \
            app-autonome.skill app-autonome.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

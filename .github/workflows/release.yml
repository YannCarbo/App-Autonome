name: release

# Sur push vers main touchant les sources du skill : reconstruit le .skill,
# incrémente le patch de la dernière Release et publie la nouvelle version avec
# sa copie .zip (import « dossier » Mistral/Gemini). C'est le seul canal de
# distribution — ces artefacts ne sont jamais commités, et les boutons de
# téléchargement de docs/index.html pointent sur /releases/latest/download/.

on:
  push:
    branches: [main]
    paths:
      - 'app-autonome/**'

permissions:
  contents: write

# Deux merges rapprochés ne doivent pas calculer la même version en parallèle.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Construire le .skill
        env:
          SRC: app-autonome
          OUT: app-autonome.skill
          ZIP: app-autonome.zip
        run: |
          set -euo pipefail
          # Garde-fou : la description doit tenir en 500 caractères — limite la plus
          # stricte des plateformes visées (Mistral ; Claude, ChatGPT et Gemini/AgentSkills
          # tolèrent 1024). Mesurée hors guillemets (valeur YAML réelle). On bloque avant de packager.
          DESC_LEN=$(python3 -c 'import re,sys; t=open(sys.argv[1],encoding="utf-8").read(); m=re.search(r"^description:[ \t]*(.*)$", t, re.M); v=m.group(1).strip() if m else None; v=(v[1:-1] if (v is not None and len(v)>=2 and v[0]==v[-1]==chr(34)) else v); print(len(v) if v is not None else -1)' "$SRC/SKILL.md")
          if [ "$DESC_LEN" -lt 1 ] || [ "$DESC_LEN" -gt 500 ]; then
            echo "Erreur : 'description' = $DESC_LEN caractères (attendu entre 1 et 500, limite Mistral)." >&2
            exit 1
          fi
          echo "OK : description = $DESC_LEN/500 caractères."
          # zip -X ne retire que les champs extra (uid/gid) : les mtimes et l'ordre
          # des entrées restent variables. On fige les deux pour que deux exécutions
          # sur le même commit produisent un fichier identique.
          TS=$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y%m%d%H%M.%S)
          find "$SRC" -exec touch -t "$TS" {} +
          # -prune : ne jamais embarquer d'artefacts locaux (__pycache__, .pyc, .DS_Store) —
          # le checkout CI est propre car ils sont gitignorés, mais si un step génère un
          # __pycache__ avant le zip, la release reste propre.
          find "$SRC" \( -name "__pycache__" -o -name "*.pyc" -o -name ".DS_Store" \) -prune -o -print \
            | LC_ALL=C sort | TZ=UTC zip -qX -@ "$OUT"
          # Second artefact pour l'import « dossier » (Mistral/Gemini) : copie octet
          # pour octet du .skill, donc tout aussi déterministe.
          cp "$OUT" "$ZIP"
          unzip -l "$OUT"
          sha256sum "$OUT" "$ZIP"

      - name: Calculer la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Patch incrémenté depuis la dernière Release (v1.0.0 s'il n'y en a aucune).
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            TAG="v1.0.0"
          else
            TAG=$(echo "$LAST" | awk -F. '{ $NF = $NF + 1; print }' OFS=.)
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version : ${LAST:-aucune} -> $TAG"

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh crée aussi le tag $TAG sur le commit poussé — aucun tag à pousser à la main.
          gh release create "$TAG" \
            app-autonome.skill app-autonome.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

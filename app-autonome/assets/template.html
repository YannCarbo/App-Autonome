<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TOOL_NAME}}</title>

<!-- ===== SECTION: STYLES ===== -->
<style>
  /* "App autonome" palette, carried over from the showcase page (emerald bento).
     Customize --accent to tie each tool to its business domain; the neighboring
     tones (--accent-dark/-light/-bright) derive from the same hue.

     Fonts: NEVER an external font (the tool must run offline). The stacks below
     prefer the showcase fonts IF they are already installed on the machine, and
     fall back to system fonts otherwise: no @import, no <link>. For a rendering
     identical to the showcase, Archivo / Space Grotesk / JetBrains Mono can be
     inlined as base64 (@font-face). */
  :root {
    --accent: #1E7A55;
    --accent-dark: #16603F;
    --accent-light: #E5F1EA;
    --accent-bright: #5FCF9E;
    --bg: #ECEDEF;
    --card: #FFFFFF;
    --card-2: #F6F7F5;
    --ink: #15171B;
    --text: #15171B;
    --text-2: #66706A;
    --border: #E2E4E7;
    --border-2: #DCE2DD;
    --ok: #1E7A55;
    --warning: #B35A00;
    --error: #B3261E;
    --radius: 16px;
    --radius-s: 10px;
    --shadow: 0 12px 30px rgba(9, 50, 36, .09);
    --shadow-accent: 0 10px 22px rgba(30, 115, 84, .22);
    --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-heading: "Space Grotesk", "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header: light bar, small emerald brand mark that visually links back to the
     showcase. The tool's name remains the main element. */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 15px 28px;
    display: flex;
    align-items: center;
    gap: 13px;
  }
  header .brand {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--accent);
    position: relative;
    flex: none;
  }
  header .brand::after {
    content: ""; position: absolute; inset: 9px;
    border-radius: 3px; background: var(--accent-bright);
  }
  header h1 {
    font-family: var(--font-heading);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -.01em;
    margin: 0;
  }
  header .version {
    color: var(--text-2);
    font: 500 .78rem/1 var(--font-mono);
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    margin-left: 2px;
  }

  main { max-width: 900px; margin: 32px auto; padding: 0 24px; width: 100%; flex: 1; }

  footer {
    text-align: center;
    color: var(--text-2);
    font-size: .8rem;
    padding: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .rules { font-size: .9rem; color: var(--text-2); }
  .rules strong { color: var(--ink); font-family: var(--font-heading); font-weight: 600; }
  .rules ul { margin: 10px 0 0; padding-left: 20px; }
  .rules li { margin: 4px 0; }

  /* Processing / Tool rules tabs (Step 5 of the skill).
     "Processing" active by default; "Tool rules" stays one click away. */
  .tabs {
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 16px;
    font: 500 .95rem/1 var(--font-body);
    color: var(--text-2);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .panel[hidden] { display: none; }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-s);
    padding: 11px 20px;
    font: 600 1rem/1 var(--font-body);
    cursor: pointer;
    box-shadow: var(--shadow-accent);
    transition: background .15s ease, box-shadow .15s ease, transform .06s ease;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

  /* Drop zone: <input type="file"> remains the source of truth,
     drag-and-drop is only a convenience. */
  .drop-zone {
    border: 2px dashed var(--border-2);
    border-radius: var(--radius);
    padding: 36px;
    text-align: center;
    color: var(--text-2);
    background: var(--card-2);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .drop-zone.dragover { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }

  .report-ok { color: var(--ok); font-weight: 600; }
  .report-warning { color: var(--warning); font-weight: 600; }
  .report-error { color: var(--error); font-weight: 600; }

  table.preview { border-collapse: collapse; width: 100%; font-size: .85rem; }
  table.preview th, table.preview td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
  table.preview th { background: var(--card-2); color: var(--text-2); font-weight: 600; }
  table.preview tbody tr:nth-child(even) td { background: #FBFCFB; }

  /* Accessibility: visible keyboard focus + respect for prefers-reduced-motion. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 560px) {
    header { padding: 13px 18px; }
    main { margin: 22px auto; padding: 0 18px; }
    .card { padding: 18px; }
  }
</style>

<!-- ===== SECTION: MARKUP ===== -->
</head>
<body>
<header>
  <!-- {{TOOL_NAME}}: chosen with the user, never alone (see Step 1).
       {{DATE}} in the delivered tool's date format. Bump "V1.0" on every
       evolution (maintenance mode): the file name follows in lowercase kebab-case. -->
  <div class="brand" aria-hidden="true"></div>
  <h1>{{TOOL_NAME}}</h1>
  <span class="version">V1.0 · {{DATE}}</span>
</header>

<main>
  <!-- Two mandatory tabs (Step 5): "Processing" active by default for everyday
       use, "Tool rules" always one click away. Labels follow the tool's language. -->
  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="processing" role="tab" aria-selected="true">Processing</button>
    <button type="button" class="tab" data-tab="rules" role="tab" aria-selected="false">Tool rules</button>
  </nav>

  <section class="panel" data-panel="processing" role="tabpanel">
    <!-- Build the processing interface here. Mandatory reminders for any
         data-transformation tool:
         1. before/after preview (10-20 rows) BEFORE the download button
         2. numbered report: rows read / transformed / anomalies (with row numbers)
         3. no silent correction: ambiguous cases are listed, not guessed
         4. the produced file bears a name distinct from the original -->
  </section>

  <section class="panel" data-panel="rules" role="tabpanel" hidden>
    <!-- The applied rules, in plain language: this is where the assumptions
         made at Step 1 live. -->
    <div class="card rules">
      <strong>What this tool does:</strong>
      <ul>
        <li>{{RULE_1}}</li>
        <li>{{RULE_2}}</li>
      </ul>
    </div>
  </section>
</main>

<footer>
  This tool runs entirely in your browser: no data is sent over the internet.
</footer>

<!-- ===== SECTION: LIBRARIES (do not edit) ===== -->
<!-- Each library inlined in its own script tag, preceded by a name@version
     comment + origin URL. Check the escaping of the closing-tag sequence
     before inserting (see references/libraries.md). -->

<!-- ===== SECTION: APP CODE ===== -->
<script>
"use strict";

// ------------------------------------------------------------------
// Standard file:// utilities: keep as-is when used
// ------------------------------------------------------------------

/** Downloads content as a file (the only reliable output mechanism under file://). */
function downloadFile(content, fileName, mimeType) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/** Processes an array in batches without freezing the UI (no Web Worker under file://). */
function processInBatches(items, batchSize, processOne, onProgress) {
  return new Promise((resolve) => {
    const results = [];
    let i = 0;
    (function batch() {
      const end = Math.min(i + batchSize, items.length);
      for (; i < end; i++) results.push(processOne(items[i], i));
      if (onProgress) onProgress(i, items.length);
      if (i < items.length) setTimeout(batch, 0);
      else resolve(results);
    })();
  });
}

/** Switches between the "Processing" and "Tool rules" tabs (see Step 5). */
function activateTab(name) {
  document.querySelectorAll(".tab").forEach(button => {
    const isActive = button.dataset.tab === name;
    button.classList.toggle("active", isActive);
    button.setAttribute("aria-selected", String(isActive));
  });
  document.querySelectorAll(".panel").forEach(panel => {
    panel.hidden = panel.dataset.panel !== name;
  });
}
document.querySelectorAll(".tab").forEach(button =>
  button.addEventListener("click", () => activateTab(button.dataset.tab)));
// For critical usage where the "Tool rules" tab must be seen at least once
// before the first run, see the preference-memorization example in Step 5 of
// the skill; deliberately absent here so it is not imposed by default.

// ------------------------------------------------------------------
// The tool's application code: readable, commented, never minified.
// It is the only zone (with MARKUP and STYLES) an AI re-reads in maintenance.
// ------------------------------------------------------------------

</script>
</body>
</html>

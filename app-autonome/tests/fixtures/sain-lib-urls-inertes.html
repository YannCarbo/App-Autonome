<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fixture saine — lib aux chaînes inertes</title>
<!-- Fixture POSITIVE : simule une lib minifiée inlinée contenant des URL en chaîne
     et un fetch() dans du code mort — le cas normal d'un build minifié.
     Attendu : validateur 0 erreur avec AVERTISSEMENTS (URL en chaîne, fetch dans
     LIBRARIES), smoke test 0 requête sortante. -->

<!-- ===== SECTION: STYLES ===== -->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  main { max-width: 700px; margin: 24px auto; padding: 0 20px; }
</style>

<!-- ===== SECTION: MARKUP ===== -->
</head>
<body>
<header style="padding: 12px 20px">
  <h1>Fixture lib inerte</h1>
  <span class="version">V1.0 du 20/07/2026</span>
</header>
<main>
  <p>Cette fixture embarque une fausse librairie minifiée dont les URL ne sont que des chaînes.</p>
</main>
<footer>
  Cet outil fonctionne entièrement dans votre navigateur — aucune donnée n'est envoyée sur internet.
</footer>

<!-- ===== SECTION: LIBRARIES (ne pas éditer) ===== -->
<!-- fausse-lib@1.0.0 — simule un build minifié : chaînes d'URL inertes (licence,
     source map) et détection de fonctionnalité jamais exécutée -->
<script>
var fausseLib={version:"1.0.0",homepage:"https://example.com/fausse-lib",sourceMap:"https://cdn.example.com/fausse-lib.min.js.map",supporteReseau:function(){return typeof self!=="undefined"},_codeMort:function(){if(this.version==="jamais"){fetch("https://example.com/inerte")}return null}};
</script>

<!-- ===== SECTION: APP CODE ===== -->
<script>
"use strict";
document.querySelector("main p").textContent += " Version de la lib : " + fausseLib.version + ".";
</script>
</body>
</html>
